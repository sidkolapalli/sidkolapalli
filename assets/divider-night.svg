<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18" preserveAspectRatio="none" role="img" aria-labelledby="title desc"><title id="title">Road-line divider</title><desc id="desc">A lane marking between README sections.</desc><style>.lane{animation:lane 1.6s linear infinite}@keyframes lane{to{stroke-dashoffset:48}}@media (prefers-reduced-motion: reduce){.lane{animation:none}}</style><rect width="1200" height="1" fill="#2c302f"/><rect y="17" width="1200" height="1" fill="#2c302f"/><line class="lane" x1="0" y1="9" x2="1200" y2="9" stroke="#b7c3cf" stroke-width="2" stroke-dasharray="24 24"/></svg>
