name: Refresh profile

# Redraws the drive log from the contribution calendar and refreshes the
# writing list from the site's RSS feed, then commits any change.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/refresh-profile.yml"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install font tools
        run: pip install -r scripts/requirements.txt

      - name: Build images and README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_profile.py --login "${{ github.repository_owner }}"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh drive log and writing list"
            git push
          fi
